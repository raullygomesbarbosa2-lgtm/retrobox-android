name: Nébula FCEUmm Android instrumentation validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-instrumentation:
    name: FCEUmm app JNI, Activity route, and rendered-frame test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v4
      - name: Unpack versioned corresponding-source bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          test -s Nebula-16-FCEUmm-validation-source-r3.tar.gz
          tar -xzf Nebula-16-FCEUmm-validation-source-r3.tar.gz -C "$RUNNER_TEMP/source"
          SRC="$RUNNER_TEMP/source/nebula-16"
          test -f "$SRC/app/src/androidTest/java/com/raully/nebula16/FceummAndroidSmokeTest.kt"
          test -f "$SRC/tests/make_homebrew_nrom.py"
          test -f "$SRC/third_party/libretro-fceumm/LICENSE-GPL-2.0.txt"
          test -f "$SRC/third_party/libretro-fceumm/UPSTREAM.md"
          test -f "$SRC/app/src/main/assets/licenses/fceumm/COPYING"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK, NDK, CMake, and emulator image
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" 'cmake;3.22.1' \
            'system-images;android-35;google_apis;x86_64'
      - name: Host-build pinned core and validate generated original NROM
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          CORE=third_party/libretro-fceumm
          make -C "$CORE" -f Makefile.libretro clean
          make -C "$CORE" -f Makefile.libretro platform=unix HAVE_HDPACK=0
          python3 tests/make_homebrew_nrom.py "$RUNNER_TEMP/nebula-homebrew.nes"
          cc -O2 -I"$CORE/src/drivers/libretro/libretro-common/include" \
            tests/libretro_nrom_smoke.c -L"$CORE" -Wl,-rpath,"$PWD/$CORE" \
            -lfceumm_libretro -lm -o "$RUNNER_TEMP/libretro_nrom_smoke"
          "$RUNNER_TEMP/libretro_nrom_smoke" "$RUNNER_TEMP/nebula-homebrew.nes" | tee "$RUNNER_TEMP/host-smoke.log"
      - name: Build pinned FCEUmm for the x86_64 Android emulator
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CORE=third_party/libretro-fceumm
          make -C "$CORE" -f Makefile.libretro clean
          CC="$TOOLCHAIN/x86_64-linux-android23-clang"
          make -C "$CORE" -f Makefile.libretro platform=unix HAVE_HDPACK=0 \
            CC="$CC" LD="$CC" AR="$TOOLCHAIN/llvm-ar"
          mkdir -p app/src/main/jniLibs/x86_64 app/src/androidTest/assets
          cp "$CORE/fceumm_libretro.so" app/src/main/jniLibs/x86_64/libfceumm_libretro.so
          cp "$RUNNER_TEMP/nebula-homebrew.nes" app/src/androidTest/assets/homebrew.nes
      - name: Assemble app and Android instrumentation APKs
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: gradle --no-daemon :rom-import:test :chip8-core:test :nes-core:test :snes-core:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android instrumentation test on GitHub-hosted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: cd "$RUNNER_TEMP/source/nebula-16" && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify validation APK and collect test evidence
        if: always()
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fceumm-android-instrumentation-evidence"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/Nebula-16-FCEUmm-validation-source-r3.tar.gz" "$OUT/"
          cp "$RUNNER_TEMP/host-smoke.log" "$OUT/" 2>/dev/null || true
          cp -R app/build/outputs/androidTest-results "$OUT/" 2>/dev/null || true
          cp -R app/build/reports/androidTests "$OUT/" 2>/dev/null || true
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then
            unzip -l "$APK" | grep 'lib/x86_64/libfceumm_libretro.so' > "$OUT/apk-x86_64-core-check.txt"
            unzip -l "$APK" | grep 'assets/licenses/fceumm/COPYING' > "$OUT/apk-fceumm-license-check.txt"
            cp "$APK" "$OUT/Nebula-16-FCEUmm-Android-instrumentation-validation-only.apk"
          fi
          find "$OUT" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nebula-fceumm-android-instrumentation-validation-only
          path: ${{ runner.temp }}/fceumm-android-instrumentation-evidence/
          if-no-files-found: warn
          retention-days: 14
