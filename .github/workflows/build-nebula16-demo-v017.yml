name: Build Nébula 16 Demo APK v0.1.7
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar como pré-lançamento após testes verdes
        required: false
        type: boolean
        default: true
  push:
    paths:
      - 'Nebula-16-source-v0.1.7-test.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source
        run: |
          mkdir -p build-source
          unzip -q Nebula-16-source-v0.1.7-test.zip -d build-source
      - name: Test all cores and build APK
        working-directory: build-source/nebula-16
        run: gradle --no-daemon :rom-import:test :chip8-core:test :nes-core:test :snes-core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-16-demo-v0.1.7-test-apk
          path: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test prerelease APK
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-16-demo-v0.1.7
          name: Nébula 16 Demo v0.1.7 — safer ZIP ROM import
          body: |
            Pré-lançamento incremental para teste. Agora abre ROMs brutas e encontra uma entrada correspondente em ZIP: CHIP-8 .ch8, NES .nes e SNES .sfc/.smc. Limites e erros para arquivos/arquivos ZIP inválidos são tratados.
            Compatibilidade não mudou: CHIP-8 jogável; NES parcial, somente iNES mapper 0/NROM; SNES experimental e incompleto. A compatibilidade com jogos continua limitada, e os 50 sistemas não estão todos emulados. Nenhuma ROM é incluída. Teste automatizado/build Android passam no GitHub Actions; teste em aparelho físico não realizado.
          prerelease: true
          make_latest: false
          files: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
