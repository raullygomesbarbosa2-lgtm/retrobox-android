name: Build and publish RetroBox APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip && sudo unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Extract Android project
        run: unzip -q retrobox-android-github.zip -d source
      - name: Build debug APK
        working-directory: source/retrobox-android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: RetroBox v0.1.0
          body: |
            Debug APK of RetroBox.
            Includes offline CHIP-8. SNES core is not integrated yet.
            ROMs are not included.
          files: source/retrobox-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
