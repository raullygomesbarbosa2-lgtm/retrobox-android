name: Build and publish Nébula Retro v0.1.3

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true'

      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'

      - name: Extract Nébula Retro project
        run: unzip -q retrobox-android-github-v013.zip -d source

      - name: Fetch pinned LemuroidCores commit
        working-directory: source/retrobox-android
        run: |
          set -euo pipefail
          core_dir="$PWD/lemuroid-cores"
          commit="$(cat LEMUROID_CORES_COMMIT.txt)"
          test "$commit" = "fee2e824525daa22bcf318f96127fe43fa8a15ad"
          mkdir -p "$core_dir"
          git -C "$core_dir" init
          git -C "$core_dir" remote add origin https://github.com/Swordfish90/LemuroidCores.git
          git -C "$core_dir" fetch --depth=1 origin "$commit"
          git -C "$core_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$core_dir" rev-parse HEAD)" = "$commit"

      - name: Stage the cores for their supported ABIs
        working-directory: source/retrobox-android
        shell: bash
        run: |
          set -euo pipefail
          cores="$PWD/lemuroid-cores"
          dest="$PWD/lemuroid-app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86; do
            for core in pcsx_rearmed ppsspp; do
              file="lib${core}_libretro_android.so"
              src="$cores/lemuroid_core_${core}/src/main/jniLibs/$abi/$file"
              test -s "$src" || { echo "Missing or empty core binary: $src" >&2; exit 1; }
              mkdir -p "$dest/$abi"
              cp "$src" "$dest/$abi/$file"
            done
          done
          echo 'Verified PCSX-ReARMed and PPSSPP libraries for arm64-v8a, armeabi-v7a and x86.'
          find "$dest" -type f -name '*_libretro_android.so' -print

      - name: Build free bundled APK
        working-directory: source/retrobox-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :lemuroid-app:assembleFreeBundleDebug

      - name: Verify APK has both native cores for every supported ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="source/retrobox-android/lemuroid-app/build/outputs/apk/freeBundle/debug/lemuroid-app-free-bundle-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a x86; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libpcsx_rearmed_libretro_android.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libppsspp_libretro_android.so"
          done
          if unzip -Z1 "$apk" | grep -q '^lib/x86_64/'; then
            echo 'Unexpected x86_64 libraries: this build deliberately excludes x86_64 because the pinned PPSSPP file is empty.' >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$apk" release-assets/Nebula-Retro-v0.1.3.apk
          cp retrobox-android-github-v013.zip release-assets/Nebula-Retro-source-v0.1.3.zip
          sha256sum release-assets/Nebula-Retro-v0.1.3.apk | tee release-assets/SHA256SUMS.txt

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-retro-v0.1.3
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified v0.1.3 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: Nébula Retro v0.1.3 (PS1 + PSP)
          body: |
            Customized Lemuroid-based Android frontend for PS1 (PCSX-ReARMed) and PSP (PPSSPP). Includes both native cores for the supported ABIs arm64-v8a, armeabi-v7a and x86. Touch controls are available and gameplay is landscape-oriented.

            No games, BIOS, or copyrighted game images are included. PPSSPP uses HLE without an external PSP BIOS. PCSX-ReARMed can use HLE with no PS1 BIOS, but some games may have compatibility limitations.

            Keep PS1 and PSP games in separate folders whose full paths include `psx` or `psp` to identify ambiguous ISO/PBP files. See the source archive README for supported formats and setup.

            Source and attribution: Lemuroid (GPL-3.0-or-later) and LemuroidCores at commit `fee2e824525daa22bcf318f96127fe43fa8a15ad`; see the source archive and upstream per-core notices/licenses.

            Performance depends on device, game, and settings. This APK has not been gameplay-tested on the user's phone; smooth performance or a particular frame rate is not guaranteed.
          files: |
            release-assets/Nebula-Retro-v0.1.3.apk
            release-assets/Nebula-Retro-source-v0.1.3.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
