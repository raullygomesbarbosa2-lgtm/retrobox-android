name: Build Nébula Retro 0.1.3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project archive
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Extract Nébula Retro project
        run: unzip -q retrobox-android-github.zip -d source
      - name: Fetch pinned Libretro cores
        run: |
          project=source/retrobox-android
          core_dir="$project/lemuroid-cores"
          commit=$(cat "$project/LEMUROID_CORES_COMMIT.txt")
          git init "$core_dir"
          git -C "$core_dir" remote add origin https://github.com/Swordfish90/LemuroidCores.git
          git -C "$core_dir" fetch --depth=1 origin "$commit"
          git -C "$core_dir" checkout --detach FETCH_HEAD
      - name: Keep only PSP and PS1 core binaries
        run: |
          find source/retrobox-android/lemuroid-cores/bundled-cores/src/main/jniLibs -type f -name '*_libretro_android.so' \
            ! -name 'libpcsx_rearmed_libretro_android.so' \
            ! -name 'libppsspp_libretro_android.so' -delete
      - name: Build bundled PSP and PS1 APK
        working-directory: source/retrobox-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :lemuroid-app:assembleFreeBundleDebug
          test -s lemuroid-app/build/outputs/apk/freeBundle/debug/lemuroid-app-free-bundle-debug.apk
      - name: Publish APK v0.1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: Nébula Retro v0.1.3
          body: |
            Nébula Retro 0.1.3 — PSP + PlayStation (PS1), without bundled BIOS or games.
            PSP via PPSSPP HLE; PS1 via PCSX-ReARMed HLE when no BIOS is supplied (compatibility may vary).
            Touch controls and landscape gameplay are provided by the Lemuroid frontend.
            Performance depends on device and game; 30 FPS is not guaranteed on every phone.
            This GPLv3-derived build includes source and third-party notices in the public repository.
          files: source/retrobox-android/lemuroid-app/build/outputs/apk/freeBundle/debug/lemuroid-app-free-bundle-debug.apk
          fail_on_unmatched_files: true
