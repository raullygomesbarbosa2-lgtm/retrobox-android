name: Build and publish RetroBox APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Android project
        run: unzip -q retrobox-android-github.zip -d source
      - name: Build debug APK
        working-directory: source/retrobox-android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: RetroBox v0.1.1
          body: |
            APK de teste RetroBox 0.1.1.
            Inclui CHIP-8 offline. O núcleo SNES ainda não está integrado.
            Não inclui ROMs. Inicialização simplificada para diagnóstico.
          files: source/retrobox-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
