name: Build Nébula 16 Demo APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a versão demo como pré-lançamento
        required: false
        type: boolean
        default: true
  push:
    paths:
      - 'Nebula-16-source-v0.1.4-demo.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Extrair fonte da demo
        run: |
          mkdir -p build-source
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('Nebula-16-source-v0.1.4-demo.zip') as z:
              z.extractall('build-source')
          PY
      - name: Testar núcleos e compilar APK
        working-directory: build-source/nebula-16
        run: gradle --no-daemon :chip8-core:test :snes-core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-16-demo-v0.1.4-apk
          path: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK da demo
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-16-demo-v0.1.4
          name: Nébula 16 Demo v0.1.4 — APK
          prerelease: true
          make_latest: false
          files: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
