name: Validate Nébula FCEUmm source milestone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Host core smoke + Android ABIs + Kotlin tests + APK assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v4
      - name: Unpack corresponding source bundle
        run: |
          set -euo pipefail
          test -s Nebula-16-FCEUmm-validation-source.zip
          unzip -q Nebula-16-FCEUmm-validation-source.zip -d "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/nebula-16/third_party/libretro-fceumm/LICENSE-GPL-2.0.txt"
          test -f "$RUNNER_TEMP/source/nebula-16/third_party/libretro-fceumm/UPSTREAM.md"
          test -f "$RUNNER_TEMP/source/nebula-16/app/src/main/assets/licenses/fceumm/COPYING"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" 'cmake;3.22.1'
      - name: Host build FCEUmm and render original synthetic NROM
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          CORE=third_party/libretro-fceumm
          make -C "$CORE" -f Makefile.libretro clean
          make -C "$CORE" -f Makefile.libretro platform=unix HAVE_HDPACK=0
          python3 tests/make_homebrew_nrom.py "$RUNNER_TEMP/nebula-homebrew.nes"
          cc -O2 -I"$CORE/src/drivers/libretro/libretro-common/include" \
            tests/libretro_nrom_smoke.c -L"$CORE" -Wl,-rpath,"$PWD/$CORE" \
            -lfceumm_libretro -lm -o "$RUNNER_TEMP/libretro_nrom_smoke"
          "$RUNNER_TEMP/libretro_nrom_smoke" "$RUNNER_TEMP/nebula-homebrew.nes" | tee "$RUNNER_TEMP/host-smoke.log"
      - name: Cross-build pinned FCEUmm core for Android ABIs
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CORE=third_party/libretro-fceumm
          for ABI in arm64-v8a armeabi-v7a; do
            make -C "$CORE" -f Makefile.libretro clean
            if [ "$ABI" = arm64-v8a ]; then CC="$TOOLCHAIN/aarch64-linux-android23-clang"; else CC="$TOOLCHAIN/armv7a-linux-androideabi23-clang"; fi
            make -C "$CORE" -f Makefile.libretro platform=unix HAVE_HDPACK=0 \
              CC="$CC" LD="$CC" AR="$TOOLCHAIN/llvm-ar"
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp "$CORE/fceumm_libretro.so" "app/src/main/jniLibs/$ABI/libfceumm_libretro.so"
          done
      - name: Run Kotlin module tests and assemble debug validation APK
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          ./gradlew --no-daemon :rom-import:test :chip8-core:test :nes-core:test :snes-core:test :app:assembleDebug
      - name: Verify APK includes both FCEUmm ABIs and GPL notices
        working-directory: ${{ runner.temp }}/source/nebula-16
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfceumm_libretro.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libfceumm_libretro.so'
          unzip -l "$APK" | grep -q 'assets/licenses/fceumm/COPYING'
          mkdir -p "$RUNNER_TEMP/validation-artifact"
          cp "$APK" "$RUNNER_TEMP/validation-artifact/Nebula-16-FCEUmm-validation-only.apk"
          cp "$RUNNER_TEMP/host-smoke.log" "$RUNNER_TEMP/validation-artifact/host-smoke.log"
          cp "$GITHUB_WORKSPACE/Nebula-16-FCEUmm-validation-source.zip" "$RUNNER_TEMP/validation-artifact/"
          sha256sum "$RUNNER_TEMP/validation-artifact"/* > "$RUNNER_TEMP/validation-artifact/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-fceumm-ci-validation-only
          path: ${{ runner.temp }}/validation-artifact/
          if-no-files-found: error
          retention-days: 14
