name: Build and publish Nébula Retro v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nebula-v020.yml'
      - 'nebula-native-source-v020.zip'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract standalone Nébula Retro project
        run: |
          set -euo pipefail
          mkdir source
          unzip -q nebula-native-source-v020.zip -d source
          test -s source/app/build.gradle.kts
          test -s source/app/src/main/java/com/raully/nebularetro/MainActivity.kt

      - name: Fetch pinned LemuroidCores commit
        run: |
          set -euo pipefail
          core_dir="$RUNNER_TEMP/lemuroid-cores"
          commit='fee2e824525daa22bcf318f96127fe43fa8a15ad'
          git clone --filter=blob:none --no-checkout https://github.com/Swordfish90/LemuroidCores.git "$core_dir"
          git -C "$core_dir" fetch --depth=1 origin "$commit"
          git -C "$core_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$core_dir" rev-parse HEAD)" = "$commit"
          echo "CORE_DIR=$core_dir" >> "$GITHUB_ENV"

      - name: Package only PS1 and PSP core libraries for supported ABIs
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/source/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86; do
            for core in pcsx_rearmed ppsspp; do
              file="lib${core}_libretro_android.so"
              src="$CORE_DIR/bundled-cores/src/main/jniLibs/$abi/$file"
              test -s "$src" || { echo "Missing pinned core: $src" >&2; exit 1; }
              mkdir -p "$dest/$abi"
              cp "$src" "$dest/$abi/$file"
            done
          done
          test "$(find "$dest" -type f -name '*_libretro_android.so' | wc -l)" -eq 6
          find "$dest" -type f -name '*_libretro_android.so' -print

      - name: Build signed release APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK metadata, signature, ABI and core contents
        shell: bash
        run: |
          set -euo pipefail
          apk='source/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$AAPT" dump badging "$apk" | tee release-badging.txt
          grep -F "package: name='com.raully.nebularetro' versionCode='4' versionName='0.2.0'" release-badging.txt
          grep -F "sdkVersion:'23'" release-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee release-signature.txt
          grep -F 'ce3ebf1d972c09583470e184d9b86edd20eb4679fedc632d31ac9f58e8741fc8' release-signature.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          names = set(apk.namelist())
          abis = {'arm64-v8a', 'armeabi-v7a', 'x86'}
          cores = {'libpcsx_rearmed_libretro_android.so', 'libppsspp_libretro_android.so'}
          expected = {f'lib/{abi}/{core}' for abi in abis for core in cores}
          actual_cores = {n for n in names if n.startswith('lib/') and n.rsplit('/', 1)[-1] in cores}
          assert actual_cores == expected, f'core file mismatch: expected={sorted(expected)} actual={sorted(actual_cores)}'
          native_abis = {n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/')) == 3}
          assert native_abis <= abis, f'unexpected ABI(s): {native_abis - abis}'
          assert native_abis == abis, f'missing ABI(s): {abis - native_abis}'
          assert not any(n.lower().endswith(('.iso', '.cso', '.chd', '.cue', '.pbp', '.rom')) for n in names), 'game image included'
          print('Verified exactly six PS1/PSP core libraries; ABIs:', ', '.join(sorted(native_abis)))
          PY
          mkdir -p release-assets
          cp "$apk" release-assets/Nebula-Retro-v0.2.0.apk
          cp nebula-native-source-v020.zip release-assets/Nebula-Retro-source-v0.2.0.zip
          sha256sum release-assets/Nebula-Retro-v0.2.0.apk | tee release-assets/SHA256SUMS.txt
          stat -c 'APK_SIZE_BYTES=%s' release-assets/Nebula-Retro-v0.2.0.apk | tee release-assets/BUILD_INFO.txt
          printf 'Supported ABIs: arm64-v8a, armeabi-v7a, x86\n' >> release-assets/BUILD_INFO.txt

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-retro-v0.2.0
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified v0.2.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Nébula Retro v0.2.0 — frontend próprio, PSP + PS1
          body: |
            Frontend Android original do Nébula Retro, com biblioteca e fluxo nativos próprios em Kotlin; não é o app Lemuroid. Os motores de emulação são os projetos open-source PPSSPP (PSP) e PCSX-ReARMed (PS1), integrados via LibretroDroid.

            Selecione pastas separadas para PSP e PS1, atualize a biblioteca e toque em um jogo. A jogabilidade abre em paisagem com controles táteis. A primeira abertura de PSP baixa arquivos auxiliares do PPSSPP pela internet.

            Nenhum jogo, BIOS ou firmware proprietário é incluído. PPSSPP usa HLE sem BIOS PSP. PCSX-ReARMed pode usar HLE sem BIOS PS1, com limitações de compatibilidade. Desempenho depende do aparelho e do jogo; FPS específico não é garantido. ABIs incluídas: arm64-v8a, armeabi-v7a e x86 (não x86_64).

            O build foi verificado para pacote, versão, assinatura, ABIs e presença exclusiva dos seis binários nativos dos dois cores. Não houve teste de gameplay ou instalação em aparelho físico.

            Código-fonte e licenças acompanham o arquivo-fonte.
          files: |
            release-assets/Nebula-Retro-v0.2.0.apk
            release-assets/Nebula-Retro-source-v0.2.0.zip
            release-assets/SHA256SUMS.txt
            release-assets/BUILD_INFO.txt
          fail_on_unmatched_files: true
