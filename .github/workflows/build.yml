name: Verify Nébula 16 development build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease APK
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'Nebula-16-source-v0.1.3-dev.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Nébula 16 source
        run: |
          mkdir -p build-source
          unzip -q Nebula-16-source-v0.1.3-dev.zip -d build-source
      - name: Test and compile
        working-directory: build-source/nebula-16
        run: gradle --no-daemon :chip8-core:test :snes-core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-16-dev-apk
          path: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease only when requested
        if: ${{ inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-16-preview-v0.1.3
          name: Nébula 16 0.1.3 — APK de desenvolvimento
          prerelease: true
          make_latest: false
          files: build-source/nebula-16/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
